<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今天三餐吃什麼？美食輪盤</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: #0f172a;
            color: #f8fafc;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 selection:bg-pink-500 selection:text-white">

    <!-- 頂部標題與定位狀態 -->
    <header class="w-full max-w-md flex justify-between items-center py-2">
        <div>
            <h1 class="text-xl font-bold bg-gradient-to-r from-pink-400 to-amber-300 bg-clip-text text-transparent">🍽️ 今天三餐吃什麼？</h1>
            <p class="text-xs text-slate-400">一鍵抽籤，隨機拯救選擇困難</p>
        </div>
        <!-- 點擊右上角即可手動觸發定位 -->
        <button onclick="initLocation()" id="gps-status" class="text-xs bg-slate-800 text-slate-300 px-3 py-1.5 rounded-full border border-slate-700 flex items-center gap-1.5 active:scale-95 transition cursor-pointer" title="點擊重新定位">
            <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse" id="gps-dot"></span>
            <span id="gps-text">點擊定位</span>
        </button>
    </header>

    <!-- 主要內容區 -->
    <main class="w-full max-w-md flex flex-col items-center gap-6 my-auto">
        
        <!-- 輪盤畫布外框 -->
        <div class="relative w-72 h-72 sm:w-80 sm:h-80 flex items-center justify-center">
            <!-- 指針 (固定在正上方 12 點鐘方向) -->
            <div class="absolute -top-3 z-20 w-0 h-0 border-l-[12px] border-l-transparent border-r-[12px] border-r-transparent border-t-[20px] border-t-pink-500 filter drop-shadow"></div>
            
            <!-- Canvas 轉盤 (5秒滑順轉動) -->
            <canvas id="wheel" width="320" height="320" class="w-full h-full rounded-full shadow-2xl border-4 border-slate-700 transition-transform duration-[5000ms] ease-out"></canvas>
            
            <!-- 中心按鈕 -->
            <button onclick="spinWheel()" id="spin-btn" class="absolute z-10 w-20 h-20 rounded-full bg-gradient-to-tr from-pink-600 to-amber-500 text-white font-bold text-lg shadow-lg hover:scale-105 active:scale-95 transition flex items-center justify-center border-4 border-slate-900 cursor-pointer">
                抽！
            </button>
        </div>

        <!-- 結果顯示卡片 -->
        <div id="result-card" class="w-full glass-card rounded-2xl p-5 text-center hidden transform transition-all duration-300 scale-95 opacity-0">
            <span class="text-xs text-pink-400 font-semibold tracking-wider uppercase">🎉 今天決定吃這個！</span>
            <h2 id="result-title" class="text-2xl font-bold text-white mt-1 mb-3">--</h2>
            
            <div class="flex gap-2 justify-center">
                <button onclick="openGoogleMaps()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 px-4 rounded-xl text-sm transition flex items-center justify-center gap-2 shadow-lg shadow-blue-600/30 cursor-pointer">
                    🗺️ 去地圖找附近這家店
                </button>
                <button onclick="spinWheel()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 rounded-xl text-sm transition cursor-pointer">
                    再抽一次
                </button>
            </div>
        </div>

        <!-- 快速清單切換 -->
        <div class="w-full glass-card rounded-2xl p-4">
            <div class="flex justify-between items-center mb-3">
                <span class="text-sm font-semibold text-slate-300">目前候選清單 (<span id="item-count">0</span>)</span>
                <button onclick="resetToDefault()" class="text-xs text-slate-400 hover:text-pink-400 transition cursor-pointer">恢復預設台灣美食</button>
            </div>
            <div id="tags-container" class="flex flex-wrap gap-1.5 max-h-28 overflow-y-auto pr-1">
                <!-- 動態塞入項目標籤 -->
            </div>
            
            <!-- 新增項目輸入框 -->
            <div class="mt-3 flex gap-2">
                <input type="text" id="new-item-input" placeholder="想加點什麼？ (例如: 鹹酥雞)" class="flex-1 bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-pink-500">
                <button onclick="addItem()" class="bg-pink-600 hover:bg-pink-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition cursor-pointer">新增</button>
            </div>
        </div>

    </main>

    <!-- 底部 PWA 提示 -->
    <footer class="w-full max-w-md text-center py-2 text-xs text-slate-500">
        💡 提示：點擊瀏覽器選單選擇「加入主畫面」，即可當成 App 使用！
    </footer>

    <script>
        const defaultItems = [
            "排骨飯/便當", "牛肉麵", "火鍋/小火鍋", "滷肉飯", 
            "義大利麵", "日式拉麵", "麥當勞/速食", "水餃/鍋貼",
            "早午餐/漢堡", "鹹酥雞/宵夜", "自助餐", "炒飯/炒麵"
        ];

        let items = JSON.parse(localStorage.getItem('my_eat_items')) || defaultItems;
        let userLat = null;
        let userLng = null;
        let isSpinning = false;
        let currentSelected = "";

        const canvas = document.getElementById('wheel');
        const ctx = canvas.getContext('2d');
        const colors = ['#f43f5e', '#fbbf24', '#34d399', '#38bdf8', '#818cf8', '#e879f9', '#fb7185', '#facc15'];

        function initLocation() {
            const gpsDot = document.getElementById('gps-dot');
            const gpsText = document.getElementById('gps-text');

            if (!navigator.geolocation) {
                gpsDot.className = "w-2 h-2 rounded-full bg-rose-400";
                gpsText.innerText = "不支援定位";
                return;
            }

            gpsDot.className = "w-2 h-2 rounded-full bg-amber-400 animate-pulse";
            gpsText.innerText = "定位中...";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;
                    gpsDot.className = "w-2 h-2 rounded-full bg-emerald-400";
                    gpsText.innerText = "已定位";
                },
                (error) => {
                    console.warn("定位失敗:", error.message);
                    gpsDot.className = "w-2 h-2 rounded-full bg-slate-500";
                    gpsText.innerText = "使用預設區域";
                },
                { timeout: 8000, maximumAge: 60000, enableHighAccuracy: false }
            );
        }

        function drawWheel() {
            const center = canvas.width / 2;
            const radius = center - 10;
            const sliceAngle = (2 * Math.PI) / items.length;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            items.forEach((item, index) => {
                const startAngle = index * sliceAngle - Math.PI / 2;
                const endAngle = (index + 1) * sliceAngle - Math.PI / 2;

                ctx.beginPath();
                ctx.moveTo(center, center);
                ctx.arc(center, center, radius, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = colors[index % colors.length];
                ctx.fill();
                ctx.strokeStyle = '#1e293b';
                ctx.lineWidth = 2;
                ctx.stroke();

                ctx.save();
                ctx.translate(center, center);
                ctx.rotate(startAngle + sliceAngle / 2);
                ctx.textAlign = "right";
                ctx.fillStyle = "#0f172a";
                ctx.font = "bold 13px 'Noto Sans TC', sans-serif";
                ctx.fillText(item, radius - 20, 5);
                ctx.restore();
            });
        }

        function updateUI() {
            const container = document.getElementById('tags-container');
            container.innerHTML = '';
            document.getElementById('item-count').innerText = items.length;

            items.forEach((item, index) => {
                const tag = document.createElement('div');
                tag.className = "bg-slate-800 border border-slate-700 text-slate-300 text-xs px-2.5 py-1.5 rounded-lg flex items-center gap-1.5";
                tag.innerHTML = `
                    <span>${item}</span>
                    <button onclick="removeItem(${index})" class="text-slate-500 hover:text-rose-400 font-bold ml-1 cursor-pointer">×</button>
                `;
                container.appendChild(tag);
            });

            localStorage.setItem('my_eat_items', JSON.stringify(items));
            drawWheel();
        }

        function addItem() {
            const input = document.getElementById('new-item-input');
            const val = input.value.trim();
            if (val && !items.includes(val)) {
                items.push(val);
                input.value = '';
                updateUI();
            }
        }

        function removeItem(index) {
            if (items.length <= 2) {
                alert("至少要保留 2 個選項才能抽籤喔！");
                return;
            }
            items.splice(index, 1);
            updateUI();
        }

        function resetToDefault() {
            items = [...defaultItems];
            updateUI();
        }

        let currentAngle = 0;
        function spinWheel() {
            if (isSpinning || items.length === 0) return;
            isSpinning = true;

            const resultCard = document.getElementById('result-card');
            resultCard.classList.add('scale-95', 'opacity-0');
            setTimeout(() => resultCard.classList.add('hidden'), 300);

            const sliceAngleDeg = 360 / items.length;
            const winningIndex = Math.floor(Math.random() * items.length);
            
            const extraSpins = 360 * 5; 
            const targetDegreeFromTop = winningIndex * sliceAngleDeg + sliceAngleDeg / 2;
            const targetAngle = currentAngle + extraSpins + (360 - (targetDegreeFromTop + currentAngle) % 360);
            
            currentAngle = targetAngle;
            canvas.style.transform = `rotate(${currentAngle}deg)`;

            setTimeout(() => {
                isSpinning = false;
                currentSelected = items[winningIndex];
                
                document.getElementById('result-title').innerText = currentSelected;
                resultCard.classList.remove('hidden');
                setTimeout(() => resultCard.classList.remove('scale-95', 'opacity-0'), 50);

                confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }, 5000);
        }

        function openGoogleMaps() {
            if (!currentSelected) return;

            let mapsUrl = "";
            if (userLat !== null && userLng !== null) {
                mapsUrl = `https://www.google.com/maps/search/${encodeURIComponent(currentSelected)}/@${userLat},${userLng},15z`;
            } else {
                mapsUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('附近 ' + currentSelected)}`;
            }

            window.open(mapsUrl, '_blank');
        }

        // 頁面載入時嘗試背景定位
        initLocation();
        updateUI();
    </script>
</body>
</html>
